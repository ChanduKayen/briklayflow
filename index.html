<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>Briklay — Construction Finance</title>
    <meta name="description" content="Briklay construction financial management platform. Track work orders, purchase orders, and site payments." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Geist:wght@500&display=swap" rel="stylesheet"/>
    <!-- DM Sans: the Briklay ledger language (transactions ledger). NOTE: the landing branch loads this inline in Landing.tsx; dedupe to this single tag when ui/landing-sync2 merges. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
    <!-- Playfair Display: the serif "voice" for the New Transaction redesign (question headlines + ledger amounts) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet"/>
    <!-- DM Mono: the DOCKET voice of the Day Book — the voucher number, the timestamps, the running
         totals. A ledger's small print has always been set in a monospace, and it is what makes a
         card read as a document rather than a notification. Day Book only. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <!-- Noto Sans Telugu: the site speaks Telugu, and the Day Book quotes it VERBATIM. Without this the
         supervisor's own words fall back to whatever the OS happens to have, which is how a quotation
         ends up looking like an error message. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
