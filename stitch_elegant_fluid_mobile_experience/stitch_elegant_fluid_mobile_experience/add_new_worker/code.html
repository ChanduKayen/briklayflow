<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Worker - Briklay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#006c49",
                    "inverse-primary": "#bec6e0",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",

            "spacing": {

                    "margin-desktop": "32px",
                    "stack-md": "12px",

            "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #000000 !important;
            ring: 0 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg antialiased">
<!-- TopAppBar -->
<header class="sticky top-0 z-40 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 bg-surface-bright dark:bg-surface-dim">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-on-surface dark:text-inverse-on-surface">close</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-inverse-primary">New Worker</h1>
</div>
<button class="text-on-surface-variant hover:text-secondary dark:hover:text-secondary-fixed opacity-80 transition-opacity">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<main class="max-w-xl mx-auto px-margin-mobile pt-stack-md pb-32">
<form class="flex flex-col gap-stack-lg">
<!-- Section: Identity -->
<div class="flex flex-col gap-stack-md">
<h2 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Identity Details</h2>
<!-- Profile Image Upload -->
<div class="bg-surface-container-low p-gutter rounded-xl shadow-sm border border-outline-variant flex items-center gap-gutter">
<div class="h-16 w-16 rounded-full bg-surface-container-highest flex items-center justify-center border-2 border-dashed border-outline overflow-hidden">
<span class="material-symbols-outlined text-outline">add_a_photo</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-body-lg text-primary">Worker Photo</span>
<span class="text-body-sm text-on-surface-variant">Upload portrait or ID photo</span>
</div>
<button class="ml-auto p-2 bg-primary text-on-primary rounded-lg" type="button">
<span class="material-symbols-outlined">upload</span>
</button>
</div>
<!-- Inputs -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">FULL NAME</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-body-lg focus:border-primary transition-all" placeholder="e.g. Robert Smith" type="text"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">ROLE / TRADE</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-body-lg focus:border-primary transition-all">
<option disabled="" selected="" value="">Select Trade</option>
<option value="masonry">Masonry</option>
<option value="electrical">Electrical</option>
<option value="plumbing">Plumbing</option>
<option value="carpentry">Carpentry</option>
<option value="hvac">HVAC</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Section: Contact -->
<div class="flex flex-col gap-stack-md">
<h2 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Contact Information</h2>
<div class="grid grid-cols-1 gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">PHONE NUMBER</label>
<div class="flex">
<span class="bg-surface-container flex items-center px-3 border border-r-0 border-outline-variant rounded-l-lg text-body-sm">+1</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-r-lg p-3 text-body-lg focus:border-primary transition-all" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-body-lg focus:border-primary transition-all" placeholder="robert.smith@example.com" type="email"/>
</div>
</div>
</div>
<!-- Section: Verification -->
<div class="bg-surface-container-low p-gutter rounded-xl shadow-sm border border-outline-variant">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<h2 class="text-body-lg font-headline-md text-primary">Verification Status</h2>
<p class="text-body-sm text-on-surface-variant">Mark worker as verified for immediate payroll</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
</div>
<!-- Section: Bank Details -->
<div class="flex flex-col gap-stack-md">
<h2 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Bank Details</h2>
<div class="bg-surface-container-low p-gutter rounded-xl shadow-sm border border-outline-variant flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">ACCOUNT HOLDER</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-body-lg focus:border-primary transition-all" placeholder="As it appears on ID" type="text"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">BANK NAME</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-body-lg focus:border-primary transition-all" placeholder="e.g. Chase Bank" type="text"/>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">ACCOUNT NUMBER</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-data-mono focus:border-primary transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant pl-1">ROUTING / IFSC</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 text-data-mono focus:border-primary transition-all" placeholder="BRKL0012" type="text"/>
</div>
</div>
</div>
</div>
<!-- Section: Documents -->
<div class="flex flex-col gap-stack-md">
<h2 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Documents</h2>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-stack-lg flex flex-col items-center justify-center gap-stack-sm bg-surface">
<span class="material-symbols-outlined text-4xl text-outline-variant">cloud_upload</span>
<span class="text-body-lg font-headline-md">Upload Identification</span>
<span class="text-body-sm text-on-surface-variant text-center">PDF, PNG or JPG up to 10MB</span>
<button class="mt-base text-secondary font-bold text-body-sm px-4 py-2 border border-secondary rounded-lg" type="button">Select File</button>
</div>
</div>
</form>
</main>
<!-- Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface-bright/80 backdrop-blur-md z-50">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md flex items-center justify-center gap-base shadow-lg transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined" data-weight="fill">person_add</span>
            Create Worker
        </button>
</div>
<!-- Background Decoration for Style Consistency -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-secondary rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 -right-20 w-64 h-64 bg-primary-container rounded-full blur-[100px]"></div>
</div>
</body></html>
