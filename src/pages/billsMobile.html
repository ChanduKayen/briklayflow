<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15100C">
<meta name="color-scheme" content="light">
<title>Briklay · Bills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --ground:#FAF8F3; --paper:#FFFFFF; --ink:#2B211A; --ink-2:#5C4F45; --ink-3:#8A7B6E; --line:#E9E1D6; --line-2:#DCD2C4; --rule:#F0E9DF;
  --night:#15100C; --cream:250,248,243; --clay:#B5472A; --clay-hi:#D4633E; --clay-wash:#FBEDE6; --sage:#2F5D3A; --sage-hi:#8FC79A; --sage-wash:#E7F0E6; --sheet:#F4EFE6;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1); --nav-h:64px; --nav-gap:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--clay-hi);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--ground)}
.view,.page{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom))}

/* =====================================================================
   BILLS.  A drawer of paper. What is linked against each paper is what turns into vendor credit in Ledgers.
     header   what you owe on bills, and how OLD that debt is (this week · 8–30 days · older). Age is the credit story.
     Bills    the drawer. Every row leads with the paper itself, slightly askew, like a bill on a desk.
              Status is one word with meaning: due · part paid · paid. A bill with no number carries the hollow ring (it cannot be duplicate-checked).
              Vendor credit itself lives in Ledgers; this page feeds it. Each bill links out to its vendor's ledger.
   BILL.      the paper is the hero. Then: is it paid? (settlement, with the Book payment that probably paid it, one tap to link)
              then what the bill says (lines, double-ruled total), then its particulars. Delete is in ⋯ and must be held.
   ===================================================================== */
.hero{background:var(--night);color:rgb(var(--cream));padding:20px 20px 18px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:-.01em;line-height:1.1}
.icb{width:40px;height:40px;border:0;border-radius:20px;background:rgba(var(--cream),.07);color:rgba(var(--cream),.85);display:grid;place-items:center}
.icb svg{width:20px;height:20px;fill:currentColor}
.owed{display:flex;align-items:baseline;gap:8px;margin-top:16px;font-family:var(--mono);font-size:31px;letter-spacing:-.01em}
.owed small{font-family:var(--sans);font-size:14px;color:rgba(var(--cream),.55)}
.sub{margin:4px 0 0;font-size:13px;color:rgba(var(--cream),.55)}
.age{display:flex;gap:3px;height:6px;margin:16px 0 10px;border-radius:3px;overflow:hidden}
.age i{display:block;height:100%;border-radius:1px}
.ages{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:8px}
.ages button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 0;border:0;background:none;text-align:left;color:rgba(var(--cream),.6);font-size:12px}
.ages b{font-family:var(--mono);font-weight:500;font-size:13.5px;color:rgba(var(--cream),.92)}
.ages span{display:flex;align-items:center;gap:6px}
.ages i{width:7px;height:7px;border-radius:50%}
.ages button[aria-pressed="true"] span{color:rgb(var(--cream));text-decoration:underline;text-underline-offset:3px}
.c0{background:rgba(var(--cream),.4)}.c1{background:rgba(var(--cream),.85)}.c2{background:var(--clay-hi)}

.compact{position:absolute;left:0;right:0;top:0;z-index:12;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--night);color:rgb(var(--cream));transform:translateY(-100%);transition:transform .35s var(--ease)}
.compact.on{transform:none}
.compact b{font-family:var(--serif);font-weight:600;font-size:19px}
.compact span{font-family:var(--mono);font-size:14px;color:rgba(var(--cream),.85)}
.compact small{font-family:var(--sans);font-size:12px;color:rgba(var(--cream),.5);margin-left:6px}

.tools{position:-webkit-sticky;position:sticky;top:52px;z-index:6;padding:12px 16px 8px;background:linear-gradient(var(--ground) 88%,rgba(250,248,243,0));transition:transform .34s var(--ease),opacity .25s}
.tools.tuck{transform:translateY(-120%);opacity:0;pointer-events:none}
.seg2{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:18px;background:#EFE9DF}
.seg2 .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:var(--paper);box-shadow:0 2px 8px -3px rgba(43,33,26,.25);transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.seg2 button{position:relative;z-index:1;height:40px;border:0;background:none;font-size:14.5px;font-weight:600;color:var(--ink-3);transition:color .3s}
.seg2 button[aria-pressed="true"]{color:var(--ink)}
.find{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--paper);border:1px solid var(--line)}
.find svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.find input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px}
.find input::placeholder{color:var(--ink-3)}
.find:focus-within{border-color:var(--ink)}
.chips{display:flex;gap:6px;margin-top:10px;user-select:none;-webkit-user-select:none}
.chip{flex:1 1 auto;height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line-2);background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.result{margin:10px 8px 0;font-size:13px;color:var(--ink-2)}
.result b{font-family:var(--mono);font-weight:500;color:var(--ink)}

.month{display:flex;align-items:baseline;justify-content:space-between;padding:20px 24px 9px}
.month h2{margin:0;font-family:var(--serif);font-weight:500;font-size:18px}
.month span{font-size:13px;color:var(--ink-3)}
.month span b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
.card{margin:0 16px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.card + .card{margin-top:12px}
.bill{display:flex;align-items:center;gap:15px;width:100%;min-height:84px;padding:12px 18px 12px 16px;border:0;border-top:1px solid var(--rule);background:none;text-align:left;transition:background-color .2s}
.bill:first-child{border-top:0}
.bill:active{background:#F7F2EA}
.bill.lit{animation:lit 2.2s ease-out}
@keyframes lit{0%,30%{background:var(--sage-wash)}100%{background:var(--paper)}}
/* the paper */
.sheet{position:relative;flex:none;width:44px;height:58px;border-radius:5px;background:var(--sheet);overflow:hidden;box-shadow:0 5px 12px -6px rgba(43,33,26,.45),0 0 0 1px rgba(43,33,26,.06);transform:rotate(-2deg)}
.bill:nth-child(even) .sheet{transform:rotate(1.5deg)}
.sheet svg,.sheet img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet.none{background:none;box-shadow:none;border:1.5px dashed var(--line-2)}
.bx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.b1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.b1 b{min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b1 .amt{flex:none;font-family:var(--mono);font-size:15.5px;font-weight:500}
.b2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b2 .meta{min-width:0;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{display:inline-block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--clay);margin:0 5px -1px 0}
.st{flex:none;font-size:12.5px;font-weight:600;color:var(--ink-2)}                  /* a bill from this week is not an alarm */
.st.late{color:var(--clay)}
.st.old{color:var(--clay);font-weight:700}
.st.fits{display:inline-flex;align-items:center;gap:5px;color:var(--sage)}
.st.fits i{width:6px;height:6px;border-radius:50%;background:var(--sage)}
.st.part{color:var(--ink-2)}
.st.paid{display:inline-flex;align-items:center;gap:5px;color:var(--sage)}
.st svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vrow{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 16px;border:0;border-top:1px solid var(--rule);background:none;text-align:left}
.vrow:first-child{border-top:0}
.vrow:active{background:#F7F2EA}
.av{flex:none;width:40px;height:40px;border-radius:20px;background:#F3EEE5;color:var(--ink-2);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.vbar{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:5px}
.vbar i{display:block;height:100%;border-radius:2px;background:var(--sage-hi)}
.empty{margin:20px 16px 0;padding:26px 20px;border:1.5px dashed var(--line-2);border-radius:22px;text-align:center;font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-size:16.5px;color:var(--ink);margin-bottom:4px}

/* pages that slide over the list */
.page{z-index:14;background:var(--ground);transform:translateX(100%);visibility:hidden;transition:transform .46s var(--ease),visibility 0s .46s}
.page.on{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.page.lift{transition:none!important;transform:none}
.pp.fly{transform-origin:0 0;z-index:3}
.pbar b{flex:1;min-width:0;text-align:center;font-family:var(--serif);font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .3s var(--ease)}
.pbar.named b{opacity:1;transform:none}
.app.deep .view{transform:translateX(-22%);transition:transform .5s var(--ease)}
.view{transition:transform .46s var(--ease)}
.pbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px 0 6px;background:rgba(250,248,243,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pbar button{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;border:0;border-radius:22px;background:none;font-size:15px;font-weight:600;color:var(--ink-2)}
.pbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pbar .dots svg{fill:currentColor;stroke:none}
.phead{padding:6px 20px 0}
.phead h1{margin:0;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.phead p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.pamt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.pamt b{font-family:var(--mono);font-weight:500;font-size:32px;letter-spacing:-.01em}
.cap{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:16px;font-size:13.5px;font-weight:600;transition:background-color .4s,color .4s,box-shadow .4s}
.cap.due{box-shadow:inset 0 0 0 1.5px var(--clay);color:var(--clay)}
.cap.part{box-shadow:inset 0 0 0 1.5px var(--ink-2);color:var(--ink-2)}
.cap.paid{background:var(--sage);color:#fff}
.cap svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bigsheet{position:relative;display:block;width:calc(100% - 32px);margin:18px 16px 0;height:230px;padding:0;border:0;border-radius:16px;background:var(--sheet);overflow:hidden;box-shadow:0 18px 36px -22px rgba(43,33,26,.55),0 0 0 1px rgba(43,33,26,.07)}
.bigsheet{background:#E9E2D5}
.bigsheet .pp{position:absolute;left:50%;top:20px;width:176px;height:234px;margin-left:-88px;border-radius:6px;overflow:hidden;background:var(--sheet);transform:rotate(-1.6deg);box-shadow:0 16px 30px -14px rgba(43,33,26,.55),0 0 0 1px rgba(43,33,26,.06)}
.bigsheet .pp svg,.bigsheet .pp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bigsheet::after{content:'';position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(rgba(233,226,213,0),rgba(233,226,213,.97))}
.bigsheet span{position:absolute;left:0;right:0;bottom:12px;z-index:1;text-align:center;font-size:13px;font-weight:600;color:var(--ink-2)}
.bigsheet.none{height:96px;background:none;box-shadow:none;border:1.5px dashed var(--line-2)}
.bigsheet.none::after{display:none}.bigsheet.none span{bottom:36px}
.blk{margin:14px 16px 0;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.blk h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0;padding:15px 18px 11px;font-size:15px;font-weight:600}
.blk h3 span{font-size:13px;font-weight:400;color:var(--ink-3)}
.match{margin:14px 16px 0;padding:14px 16px;border-radius:20px;background:var(--sage-wash);display:flex;flex-direction:column;gap:10px;animation:drop .5s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.match b{font-size:15px;color:var(--sage)}
.match p{margin:-6px 0 0;font-size:13.5px;color:var(--ink-2);text-wrap:pretty}
.match div{display:flex;gap:8px}
.match button{height:40px;padding:0 16px;border-radius:20px;border:0;font-size:14px;font-weight:600}
.match .y{background:var(--sage);color:#fff}.match .n{background:none;color:var(--ink-2)}
.setbar{height:6px;margin:0 18px;border-radius:3px;background:var(--clay-wash);overflow:hidden}
.setbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--sage);transition:width .9s var(--ease)}
.setnum{display:flex;justify-content:space-between;padding:9px 18px 4px;font-size:13px;color:var(--ink-2)}
.setnum b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.payrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--rule);animation:drop .5s var(--ease) both}
.payrow .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.payrow b{font-size:14.5px;font-weight:600}
.payrow .m > span{font-size:12.5px;color:var(--ink-3)}
.payrow em{font-style:normal;font-family:var(--mono);font-size:14.5px}
.tickc{flex:none;width:26px;height:26px;border-radius:13px;background:var(--sage-wash);color:var(--sage);display:grid;place-items:center}
.tickc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.none2{padding:2px 18px 6px;font-size:14px;color:var(--ink-3)}
.two{display:flex;gap:8px;padding:12px 14px 14px}
.two button{flex:1;height:46px;border-radius:15px;border:1px solid var(--line-2);background:none;font-size:14.5px;font-weight:600}
.two .pri{background:var(--clay);border-color:var(--clay);color:#fff}
.ln{display:flex;align-items:baseline;gap:10px;padding:11px 18px;border-top:1px solid var(--rule)}
.ln b{flex:1;min-width:0;font-size:15px;font-weight:500}
.ln span{flex:none;font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.ln em{flex:none;min-width:70px;text-align:right;font-style:normal;font-family:var(--mono);font-size:14.5px}
.tot{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 18px 16px;border-top:1px solid var(--rule)}
.tot i{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-2)}
.tot b{font-family:var(--mono);font-weight:500;font-size:15px;padding:0 0 5px 28px;border-bottom:3px double var(--ink)}
.kv{display:flex;align-items:baseline;gap:12px;width:100%;min-height:48px;padding:12px 18px;border:0;border-top:1px solid var(--rule);background:none;text-align:left}
.kv span{flex:none;width:92px;font-size:14px;color:var(--ink-3)}
.kv b{flex:1;min-width:0;text-align:right;font-size:15px;font-weight:600}
.kv b.warn{color:var(--clay)}
/* statement */
.sline{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--rule)}
.sline:first-of-type{border-top:0}
.sline .k{flex:none;width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:#F3EEE5;color:var(--ink-2)}
.sline .k svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sline .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sline b{font-size:15px;font-weight:600}
.sline .m > span{font-size:12.5px;color:var(--ink-3)}
.sline b{color:var(--ink)}
.sline .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.sline em{font-style:normal;font-family:var(--mono);font-size:14.5px}
.sline em.minus{color:var(--sage)}
.sline small{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.flagc{margin:14px 16px 0;padding:14px 16px;border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--clay);font-size:14px;color:var(--ink-2);text-wrap:pretty}
.flagc b{display:block;color:var(--ink);margin-bottom:2px}

/* =====================================================================
   LINK A PAYMENT.  Nothing is created here. It only ties the bill to money that is ALREADY in Book.
     eligible  same vendor · same site · not yet linked to any bill. (One quiet switch widens it to the vendor's other sites: sites get mis-tagged.)
     1 pick    the bill's amount sits on top as a target. Each payment you tick pours into it; the bar fills; the words say what is still to cover.
               Best guesses float up and say why: "same amount", "closest date". Pick one or several.
               If a payment is bigger than what is left, only what is needed is used and the rest stays free for another bill. It says so, on that row.
     2 check   one slip: what goes where, and what the bill becomes (Paid · or ₹X left). Then link. Undo is one tap.
   ===================================================================== */
.wz{display:flex;flex-direction:column;min-height:0}
.steps{display:flex;gap:6px;padding:16px 8px 0 0}
.steps i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(var(--cream),.35);transition:background-color .3s,box-shadow .3s,transform .4s var(--ease)}
.steps i.was{background:rgba(var(--cream),.8);box-shadow:none}.steps i.now{background:var(--clay-hi);box-shadow:none;transform:scale(1.25)}
.target{margin:2px 0 12px}
.target .fig{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;font-variant-numeric:lining-nums}
.target .fig span{font-size:22px;color:var(--clay-hi)}
.target .fig small{font-family:var(--sans);font-weight:400;font-size:13.5px;color:rgba(var(--cream),.55)}
.pour{height:6px;margin:12px 0 8px;border-radius:3px;background:rgba(var(--cream),.12);overflow:hidden}
.pour i{display:block;height:100%;width:0;border-radius:3px;background:var(--sage-hi);transition:width .6s var(--ease)}
.target p{margin:0;min-height:19px;font-size:13.5px;color:rgba(var(--cream),.7)}
.target p b{font-family:var(--mono);font-weight:500;color:rgb(var(--cream))}
.target p.full{color:var(--sage-hi)}
.cands{display:flex;flex-direction:column;max-height:266px;overflow:auto;margin:0 -4px;scrollbar-width:none}
.cands::-webkit-scrollbar{display:none}
.cand{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 4px;border:0;border-radius:14px;background:none;color:rgb(var(--cream));text-align:left;box-shadow:0 1px 0 0 rgba(var(--cream),.08);transition:background-color .2s;animation:candIn .4s var(--ease) both}
@keyframes candIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cand:active{background:rgba(var(--cream),.06)}
.cand .pick{flex:none;width:26px;height:26px;border-radius:13px;box-shadow:inset 0 0 0 1.5px rgba(var(--cream),.3);display:grid;place-items:center;transition:background-color .25s,box-shadow .25s,transform .3s var(--ease)}

<script>
const $ = (s) => document.querySelector(s);

const inr = (n) => '₹' + Math.round(+n || 0).toLocaleString('en-IN');

const short = (s) => s.replace(' Residence', '').replace(' Apartments', '');
const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const TODAY = 19;                                                                  /* 19 Sept 2026 */

function sheetSVG(v) {

    '<rect x="12" y="36" width="104" height="7" fill="#2B211A" opacity=".12"/>' +
    rows.map((y, i) => '<rect x="12" y="' + y + '" width="' + (44 + (i * 17 + v * 7) % 30) + '" height="3.5" rx="1.75" fill="#2B211A" opacity=".28"/><rect x="94" y="' + y + '" width="22" height="3.5" rx="1.75" fill="#2B211A" opacity=".28"/>').join('') +
    '<path d="M12 133h104" stroke="#2B211A" stroke-opacity=".25" stroke-dasharray="3 3"/><rect x="80" y="142" width="36" height="8" rx="2" fill="#2B211A" opacity=".8"/></svg>';
}

/* stand-in data. paid = what Book payments have been linked against the bill so far. */

const B = (vendor, no, d, mon, site, amt, o) => Object.assign({ id: ++uid, vendor, no, d, mon, site, amt, pays: [], img: true, lines: [], po: '', by: 'Photo · Raju', cat: 'Materials' }, o || {});

  B('KKD Hardware', '2291', 17, 'Sep', 'ASM Elite Apartments', 25000, { lines: [['Binding wire', '40 kg × ₹95', 3800], ['Cover blocks', '2,000 × ₹6', 12000], ['Nails, assorted', '', 9200]], cat: 'Hardware' }),

  B('Sai Sand Suppliers', '88', 15, 'Sep', 'Dr Soundharya Residence', 8500, { lines: [['River sand', '2 loads × ₹4,250', 8500]], cat: 'Sand' }),
  B('Pattabhi Traders', '3561', 12, 'Sep', 'Dr Shyam\'s Residence', 118000, { lines: [['Steel 12mm', '2 T × ₹59,000', 118000]], po: 'PO-104', cat: 'Steel' }),
  B('Sri Veera Durga Waterproofing', 'SVD/26-27-1395', 11, 'Sep', 'Dr Soundharya Residence', 38600, { lines: [['Terrace waterproofing', '1,930 sft × ₹20', 38600]], pays: [['14 Sept · NEFT', 20000]], cat: 'Waterproofing' }),
  B('Ravi Electricals', '774', 2, 'Sep', 'ASM Elite Apartments', 6400, { lines: [['Conduit 20mm', '40 lengths × ₹160', 6400]], pays: [['4 Sept · UPI', 6400]], cat: 'Electrical' }),

const T = (vendor, site, label, order, via, note, amt) => ({ id: ++tid, vendor, site, label, order, via, note, amt, free: amt });

];
const eligible = (b, wide) => TXNS.filter((t) => t.vendor === b.vendor && t.free > 0 && (wide || t.site === b.site));
const NOBILLS = [{ vendor: 'Devi lorry services', paid: 995400 }];                 /* paid in Book, nothing in the drawer */
const paidOf = (b) => b.pays.reduce((a, p) => a + p[1], 0), left = (b) => b.amt - paidOf(b);

    '<div class="wzbody' + (back ? ' back' : '') + '"><div class="target"><div class="fig"><span>₹</span>' + Math.round(need).toLocaleString('en-IN') + '<small>to cover' + (b.no ? ' · bill ' + esc(b.no) : '') + '</small></div><div class="pour"><i id="pour"></i></div><p id="pourTxt"></p></div>' +

    slot.innerHTML = p && p.use < p.t.free ? '<span class="why part">' + (p.use ? inr(p.use) + ' used · ' + inr(p.t.free - p.use) + ' stays free' : 'not needed') + '</span>'
      : o === 'same' ? '<span class="why">same amount</span>' : o === 'near' ? '<span class="why part">closest date</span>' : '';
  });
  const n = al.filter((p) => p.use > 0).length, btn = $('#wzNext'); btn.disabled = !n; btn.textContent = n ? 'Next · ' + inr(got) + ' from ' + n + (n === 1 ? ' payment' : ' payments') : 'Pick a payment';
}
function wzCheck() {
  const b = W.b, al = allocate().filter((p) => p.use > 0), got = al.reduce((a, p) => a + p.use, 0), rest = left(b) - got;
  $('#wz').innerHTML = wzHead('Check the link', 'Nothing new is created. These Book entries get tied to this bill.', 2) +
    '<div class="wzbody">' + al.map((p) => '<div class="alloc"><span>' + esc(p.t.label) + ' · ' + esc(p.t.via) + (p.use < p.t.free ? '<small>' + inr(p.t.free - p.use) + ' of it stays free for another bill</small>' : '') + '</span><b>' + inr(p.use) + '</b></div>').join('') +
    '<div class="becomes"><span>' + esc(b.vendor) + (b.no ? ' · ' + esc(b.no) : '') + ' becomes</span>' + (rest <= 0 ? '<span class="cap paid">' + TICK + 'Paid</span>' : '<span class="cap part">' + inr(rest) + ' left</span>') + '</div>' +
    '<button type="button" class="wzbtn" id="wzLink">Link ' + (al.length === 1 ? 'this payment' : al.length + ' payments') + '</button></div>';
}
function openMenu() {
  openPanel('<div class="p-head"><div class="t"><h2>' + (openBill ? 'This bill' : openVendor ? esc(openVendor) : 'Bills') + '</h2></div>' + X + '</div>' +
    (openBill ? '<button type="button" class="opt" data-toast="Share the paper and what was read"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></svg><span class="m"><b>Share</b></span></button>' +
      '<button type="button" class="opt" data-toast="Read the paper again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/></svg><span class="m"><b>Read it again</b></span></button>' +
      '<button type="button" class="opt danger" id="del"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/></svg><span class="m"><b>Hold to delete this bill</b></span></button>'
    : '<button type="button" class="opt" data-toast="Exports what is shown as CSV, with the papers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span class="m"><b>Export what is shown</b></span></button>' +
      '<button type="button" class="opt" data-toast="Send this statement to the vendor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></svg><span class="m"><b>Share a statement</b></span></button>'));
  const d = $('#del'); if (!d) return; let t = 0;
  const stop = () => { if (!d.classList.contains('hold')) return; clearTimeout(t); d.classList.remove('hold'); say('Keep holding to delete'); };
  d.addEventListener('contextmenu', (e) => e.preventDefault());
  d.addEventListener('pointerdown', (e) => { e.preventDefault(); d.classList.add('hold'); buzz(6); t = setTimeout(() => { d.classList.remove('hold'); buzz([14, 40, 24]); const b = openBill, i = BILLS.indexOf(b); BILLS.splice(i, 1); closePanel(); closePage(); say('Bill deleted · ' + inr(b.amt), () => { BILLS.splice(i, 0, b); paint(b.id); }); }, 1000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((n) => d.addEventListener(n, stop));
}
panel.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) { closePanel(); return; }
  if (b.dataset.toast) { say(b.dataset.toast); return; }
  if (b.dataset.t) { const id = +b.dataset.t, i = W.picked.indexOf(id); i >= 0 ? W.picked.splice(i, 1) : W.picked.push(id); b.setAttribute('aria-pressed', i < 0); buzz(4); wzMeter(); return; }
  if (b.hasAttribute('data-wide')) { W.wide = !W.wide; if (!W.wide) W.picked = W.picked.filter((id) => TXNS.find((t) => t.id === id).site === W.b.site); buzz(4); wzPick(); return; }
  if (b.id === 'wzNext') { buzz(6); wzCheck(); return; }
  if (b.hasAttribute('data-wzback')) { wzPick(true); return; }
  if (b.id === 'wzLink') { const picks = allocate().filter((p) => p.use > 0), bill = W.b; b.classList.add('ok'); b.textContent = 'Linked'; setTimeout(() => { closePanel(); applyLinks(bill, picks); }, 520); }
});
$('#more').addEventListener('click', openMenu);
scrim.addEventListener('click', closePanel);
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('#viewer').classList.contains('on')) $('#viewer').classList.remove('on'); else if (panel.classList.contains('on')) closePanel(); else if (page.classList.contains('on')) closePage(); });

/* ---------- the action capsule follows what you are looking at ---------- */
const fab = $('#fab'); let folded = false;
const PLUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>', GO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
function paintFab() {
  const inline = page.querySelector('[data-link]'), seen = inline && inline.getBoundingClientRect().top < page.getBoundingClientRect().bottom - 150 && inline.getBoundingClientRect().bottom > 60;
  const onBill = page.classList.contains('on') && openBill, payable = onBill && left(openBill) > 0 && !seen, text = payable ? 'Link a payment' : 'Bill';
  $('#fabIc').innerHTML = payable ? GO : PLUS; $('#measure').textContent = text; $('#fabLbl').textContent = text; fab.setAttribute('aria-label', payable ? text : 'Add a bill');
  fab.style.setProperty('--w', Math.ceil(48 + $('#measure').getBoundingClientRect().width + 22) + 'px');
  fab.className = 'fab' + (folded ? ' folded' : '') + ((page.classList.contains('on') && !payable) || panel.classList.contains('on') ? ' away' : '');
}
fab.addEventListener('click', () => { if (page.classList.contains('on') && openBill) openLinker(openBill); else say('Opens the add-a-bill panel'); });
const view = $('#view'); let lastY = 0;
view.addEventListener('scroll', () => {
  const y = view.scrollTop, past = y > $('#hero').offsetHeight - 54, d = y - lastY;
  $('#compact').classList.toggle('on', past);
  if (Math.abs(d) > 6) { folded = d > 0 && y > 60; $('#tools').classList.toggle('tuck', d > 0 && past && document.activeElement !== $('#q')); fab.classList.toggle('folded', folded); lastY = y; }
  if (!past) $('#tools').classList.remove('tuck'); if (y < 8) { folded = false; fab.classList.remove('folded'); }
}, { passive: true });
page.addEventListener('scroll', (() => { let l = 0; return () => { const y = page.scrollTop, d = y - l; const pb = $('#pbar'); pb && pb.classList.toggle('named', y > 70); if (Math.abs(d) > 6) { folded = false; l = y; paintFab(); } }; })(), { passive: true });
$('#q').addEventListener('focus', () => $('#tools').classList.remove('tuck'));
document.querySelectorAll('[data-x]').forEach((b) => b.addEventListener('click', () => say('Only Bills is built in this prototype')));

let toastT = 0, undoFn = null;
function say(text, undo) { $('#toastText').textContent = text; undoFn = undo || null; $('#toastBtn').hidden = !undo; $('#toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), undo ? 4500 : 2000); }
$('#toastBtn').addEventListener('click', () => { $('#toast').classList.remove('on'); if (undoFn) { buzz(5); undoFn(); undoFn = null; } });

paint();
</script>
