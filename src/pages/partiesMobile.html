<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#15100C">
<meta name="color-scheme" content="light">
<title>Briklay · Parties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap">
<style>
:root{
  --ground:#FAF8F3; --paper:#FFFFFF; --ink:#2B211A; --ink-2:#5C4F45; --ink-3:#8A7B6E; --line:#E9E1D6; --line-2:#DCD2C4; --rule:#F0E9DF;
  --night:#15100C; --cream:250,248,243; --clay:#B5472A; --clay-hi:#D4633E; --clay-wash:#FBEDE6; --sage:#2F5D3A; --sage-hi:#8FC79A; --sage-wash:#E7F0E6;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1); --nav-h:64px; --nav-gap:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--clay-hi);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--ground)}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom))}

/* =====================================================================
   PARTIES.  It is the phone book of the business, with money in it. So it behaves like a phone book:
     find      search first, A to Z underneath, always. A letter rail on the edge to jump. 184 names should take one gesture.
               The order never changes, so a name is always where it was yesterday. Money is a filter (tap the header), never a re-sort.
     money     the header says what you owe, to how many. "Paid ahead of bills" is not a boast, it is a flag: payments with no bill behind them.
     rows      two lines. Name, then what they are. On the right only the number that matters for THAT party:
               what you owe · or what they are paid ahead · or, quietly, what they have been paid. Nothing when there is nothing.
               "Active" is the normal state, so it is not printed 120 times. Only "pending" gets a mark.
     tap       the row opens the ledger. The small ⋯ opens the party itself: call, WhatsApp, and every detail, edited in place.
     add       from your contacts first (nobody types a phone number they already have). As you type a name, it tells you if they are already here.
   ===================================================================== */
.hero{background:var(--night);color:rgb(var(--cream));padding:20px 20px 18px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:-.01em;line-height:1.1}
.icb{width:40px;height:40px;border:0;border-radius:20px;background:rgba(var(--cream),.07);color:rgba(var(--cream),.85);display:grid;place-items:center}
.icb svg{width:20px;height:20px;fill:currentColor}
.owed{display:flex;align-items:baseline;gap:8px;margin-top:16px;padding:0;border:0;background:none;color:inherit;font-family:var(--mono);font-size:31px;letter-spacing:-.01em;text-align:left}
.owed small{font-family:var(--sans);font-size:14px;color:rgba(var(--cream),.55)}
.sub{margin:4px 0 0;font-size:13px;color:rgba(var(--cream),.55)}
.pills{display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none;user-select:none;-webkit-user-select:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 12px;border-radius:19px;border:1px solid rgba(var(--cream),.14);background:none;font-size:13.5px;font-weight:600;color:rgba(var(--cream),.85);white-space:nowrap}
.pill b{font-family:var(--mono);font-weight:500}
.pill .ring{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--clay-hi)}
.pill[aria-pressed="true"]{background:rgb(var(--cream));color:var(--night);border-color:transparent}
.compact{position:absolute;left:0;right:0;top:0;z-index:12;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--night);color:rgb(var(--cream));transform:translateY(-100%);transition:transform .35s var(--ease)}
.compact.on{transform:none}
.compact b{font-family:var(--serif);font-weight:600;font-size:19px}
.compact span{font-family:var(--mono);font-size:14px;color:rgba(var(--cream),.85)}
.compact small{font-family:var(--sans);font-size:12px;color:rgba(var(--cream),.5);margin-left:6px}

.tools{position:-webkit-sticky;position:sticky;top:52px;z-index:6;padding:12px 16px 10px;background:var(--ground);box-shadow:0 8px 10px -8px rgba(43,33,26,.14);transition:transform .34s var(--ease),opacity .25s}
.tools.tuck{transform:translateY(-120%);opacity:0;pointer-events:none}
.find{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--paper);border:1px solid var(--line)}
.find > svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.find input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px}
.find input::placeholder{color:var(--ink-3)}
.find:focus-within{border-color:var(--ink)}
.sortb{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:0;border-radius:18px;background:#F3EEE5;font-size:13px;font-weight:600;color:var(--ink-2)}
.sortb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;margin-top:10px;user-select:none;-webkit-user-select:none}
.chip{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 6px;border-radius:18px;border:1px solid var(--line-2);background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.chip em{font-style:normal;font-family:var(--mono);font-size:11.5px;font-weight:400;opacity:.65}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.result{margin:10px 8px 0;font-size:13px;color:var(--ink-2);text-wrap:pretty}
.result b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.result button{margin-left:6px;padding:0;border:0;background:none;font-size:13px;font-weight:600;color:var(--clay);text-decoration:underline;text-underline-offset:2px}

.sec{display:flex;align-items:baseline;justify-content:space-between;padding:20px 24px 9px;scroll-margin-top:170px}
.sec h2{margin:0;font-family:var(--serif);font-weight:500;font-size:18px}
.sec span{font-size:13px;color:var(--ink-3)}
.sec span b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
.card{margin:0 24px 0 16px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.card.wide{margin-right:16px}
.row{display:flex;align-items:center;width:100%;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row.lit{animation:lit 2.2s ease-out}
@keyframes lit{0%,30%{background:var(--sage-wash)}100%{background:var(--paper)}}
.go{flex:1;min-width:0;display:flex;align-items:center;gap:11px;min-height:68px;padding:10px 0 10px 14px;border:0;background:none;text-align:left}
.go:active{background:#F7F2EA}
.av{flex:none;width:38px;height:38px;border-radius:19px;background:#F3EEE5;color:var(--ink-2);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.av.w{background:var(--sage-wash);color:var(--sage)}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm b{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{display:inline-block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--clay);margin:0 5px -1px 0}
.fig{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-left:4px}
.fig b{font-family:var(--mono);font-weight:500;font-size:14px}
.fig small{font-size:11.5px;font-weight:600;color:var(--clay)}
.fig.ahead b{color:var(--ink-2)}.fig.ahead small{color:var(--ink-3)}
.fig.paid b{font-size:13px;color:var(--ink-3)}.fig.paid small{color:var(--ink-3);font-weight:400}
.dots{flex:none;width:36px;height:68px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center}
.dots svg{width:18px;height:18px;fill:currentColor}
.dots:active{color:var(--ink)}
.rail{position:absolute;right:2px;top:50%;z-index:8;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .25s}
.rail button{width:22px;height:17px;padding:0;border:0;background:none;font-size:10.5px;font-weight:700;color:var(--ink-3);line-height:17px}
.rail button.on{color:var(--clay)}
.rail.hide{opacity:0;pointer-events:none}
.letter{position:absolute;left:50%;top:42%;z-index:30;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:24px;background:rgba(21,16,12,.88);color:rgb(var(--cream));display:grid;place-items:center;font-family:var(--serif);font-size:40px;font-weight:600;opacity:0;transform:scale(.9);transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.letter.on{opacity:1;transform:none}
.empty{margin:20px 16px 0;padding:26px 20px;border:1.5px dashed var(--line-2);border-radius:22px;text-align:center;font-size:14.5px;color:var(--ink-2);text-wrap:pretty}
.empty b{display:block;font-size:16.5px;color:var(--ink);margin-bottom:4px}
.empty button{margin-top:12px;height:42px;padding:0 18px;border:0;border-radius:21px;background:var(--clay);color:#fff;font-size:14.5px;font-weight:600}

/* bar, capsule, toast, panel */
.nav{position:absolute;left:var(--nav-gap);right:var(--nav-gap);bottom:calc(var(--nav-gap) + env(safe-area-inset-bottom));z-index:20;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);padding:0 6px;border-radius:32px;background:var(--night);box-shadow:0 18px 36px -14px rgba(21,16,12,.55);user-select:none;-webkit-user-select:none;transition:opacity .2s}
.app.kb .nav{opacity:0;pointer-events:none}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:0 0 7px;border:0;background:none;color:rgba(var(--cream),.52)}
.tab[aria-current="page"]{color:rgb(var(--cream))}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:600}
.count{font-style:normal;position:absolute;top:8px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--clay-hi);color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--night)}
.here{position:absolute;bottom:7px;left:90%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--clay-hi)}
.fab{position:absolute;right:16px;bottom:calc(var(--nav-gap) + var(--nav-h) + 14px + env(safe-area-inset-bottom));z-index:19;height:54px;width:126px;padding:0;border:0;border-radius:27px;background:var(--clay);color:#fff;display:flex;align-items:center;overflow:hidden;white-space:nowrap;user-select:none;-webkit-user-select:none;
  box-shadow:0 16px 28px -14px rgba(181,71,42,.95),0 4px 10px -6px rgba(21,16,12,.4);transition:width .42s var(--ease),transform .38s var(--ease),opacity .25s}
.fab .ic{flex:none;width:54px;height:54px;display:grid;place-items:center}
.fab .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.fab .lbl{font-size:16px;font-weight:600;margin-left:-6px;transition:opacity .22s}
.fab.folded{width:54px}.fab.folded .lbl{opacity:0}
.fab.away{transform:translateY(16px) scale(.7);opacity:0;pointer-events:none}
.toast{position:absolute;left:16px;right:16px;top:62px;z-index:70;width:fit-content;max-width:calc(100% - 32px);margin-inline:auto;transform:translateY(-16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;padding:11px 8px 11px 16px;border-radius:16px;background:var(--night);color:rgb(var(--cream));font-size:14px;box-shadow:0 18px 40px -16px rgba(21,16,12,.6);transition:transform .4s var(--ease),opacity .3s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast button{min-height:34px;padding:0 12px;border:0;border-radius:10px;background:rgba(var(--cream),.14);color:#fff;font-size:13.5px;font-weight:600}
.scrim{position:absolute;inset:0;z-index:17;background:rgba(21,16,12,.38);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:absolute;left:var(--nav-gap);right:var(--nav-gap);bottom:calc(var(--nav-gap) + env(safe-area-inset-bottom) + var(--kb,0px));z-index:18;max-height:calc(100% - 24px);padding:8px 16px calc(var(--nav-h) + 14px);border-radius:32px;background:var(--night);color:rgb(var(--cream));box-shadow:0 24px 50px -16px rgba(21,16,12,.7);
  transform:translateY(24px) scale(.96);transform-origin:50% 100%;opacity:0;visibility:hidden;overflow:auto;scrollbar-width:none;transition:transform .46s var(--ease),opacity .28s,visibility 0s .46s,bottom .25s,padding-bottom .25s;-webkit-touch-callout:none}
.panel::-webkit-scrollbar{display:none}
.app.kb .panel{padding-bottom:16px}
.panel.on{transform:none;opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .3s,visibility 0s,bottom .25s,padding-bottom .25s}
.grab{display:grid;place-items:center;height:20px}.grab i{width:36px;height:4px;border-radius:2px;background:rgba(var(--cream),.18)}
.p-head{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.p-head .av{width:46px;height:46px;border-radius:23px;background:rgba(var(--cream),.1);color:rgb(var(--cream));font-size:14px}
.p-head .t{flex:1;min-width:0}
.p-head h2{margin:0;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-head span{font-size:13px;color:rgba(var(--cream),.55)}
.p-head .x{flex:none;width:40px;height:40px;margin-right:-8px;border:0;border-radius:20px;background:none;color:rgba(var(--cream),.7);display:grid;place-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.two div{padding:12px 14px;border-radius:16px;background:rgba(var(--cream),.06);display:flex;flex-direction:column;gap:2px}
.two small{font-size:12px;color:rgba(var(--cream),.5)}
.two b{font-family:var(--mono);font-weight:500;font-size:17px}
.two b.owe{color:#F0A58A}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:6px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;border-radius:16px;background:rgba(var(--cream),.08);color:rgb(var(--cream));font-size:14.5px;font-weight:600;text-decoration:none}
.acts .pri{background:var(--clay);color:#fff}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acts .wa svg{fill:#3DBB6C;stroke:none}
.rowS{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 4px;border:0;background:none;color:rgb(var(--cream));text-align:left;box-shadow:0 1px 0 0 rgba(var(--cream),.08)}
.rowS .l{flex:none;width:104px;font-size:14px;color:rgba(var(--cream),.55)}
.rowS .v{flex:1;min-width:0;text-align:right;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowS .v.none{color:rgba(var(--cream),.4);font-weight:400}
.rowS .v.mono{font-family:var(--mono);font-weight:500}
.rowS .v.chg{animation:chg .9s ease-out}
@keyframes chg{0%,25%{color:var(--clay-hi)}100%{color:rgb(var(--cream))}}
.rowS .c{flex:none;width:16px;height:16px;fill:none;stroke:rgba(var(--cream),.35);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.rowS.open{box-shadow:none}.rowS.open .c{transform:rotate(90deg)}
.pick{padding:2px 4px 14px;box-shadow:0 1px 0 0 rgba(var(--cream),.08);animation:pickIn .38s var(--ease) both}
@keyframes pickIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:16px;background:rgba(var(--cream),.07)}
.seg button{height:42px;border:0;border-radius:13px;background:none;color:rgba(var(--cream),.75);font-size:14px;font-weight:600;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:rgb(var(--cream));color:var(--night)}
.inp{display:block;width:100%;height:48px;border:0;border-radius:14px;background:rgba(var(--cream),.07);padding:0 14px;font-size:16px;color:rgb(var(--cream));outline:none}
.inp::placeholder{color:rgba(var(--cream),.4)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--clay-hi)}
.hint{margin:8px 2px 0;font-size:12.5px;color:rgba(var(--cream),.5);text-wrap:pretty}
.foot{display:flex;gap:8px;margin-top:14px}
.big{flex:1;height:52px;border:0;border-radius:16px;background:var(--clay);color:#fff;font-size:16px;font-weight:600;transition:opacity .25s,background-color .35s}
.big[disabled]{opacity:.32}
.big.ok{background:var(--sage)}
.del{position:relative;display:block;width:100%;height:44px;margin-top:6px;border:0;border-radius:14px;background:none;color:rgba(240,165,138,.85);font-size:13.5px;font-weight:600;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.del::before{content:'';position:absolute;inset:0;border-radius:14px;background:rgba(212,99,62,.2);transform:scaleX(0);transform-origin:left;transition:transform .15s}
.del.hold::before{transform:scaleX(1);transition:transform 1s linear}
.del span{position:relative}
.menu button{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;border:0;background:none;color:rgb(var(--cream));font-size:15.5px;font-weight:600;text-align:left;box-shadow:0 1px 0 0 rgba(var(--cream),.08)}
.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.menu button[aria-pressed="true"]{color:var(--clay-hi)}
.from{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:0 6px;border:0;border-radius:16px;background:rgba(var(--cream),.06);color:rgb(var(--cream));text-align:left;margin-bottom:12px}
.from i{flex:none;width:40px;height:40px;border-radius:20px;background:var(--clay);display:grid;place-items:center}
.from i svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.from span{flex:1;display:flex;flex-direction:column;gap:1px;font-size:12.5px;color:rgba(var(--cream),.5)}
.from b{font-size:15.5px;font-weight:600;color:rgb(var(--cream))}
.lab{display:block;margin:12px 4px 6px;font-size:12.5px;font-weight:600;color:rgba(var(--cream),.5)}
.tel{display:flex;align-items:center;height:48px;border-radius:14px;background:rgba(var(--cream),.07);padding-left:14px}
.tel span{font-family:var(--mono);font-size:15px;color:rgba(var(--cream),.55)}
.tel input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;padding:0 12px 0 8px;font-family:var(--mono);font-size:16px;color:rgb(var(--cream))}
.tel:focus-within{box-shadow:inset 0 0 0 1.5px var(--clay-hi)}
.twin{margin-top:10px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px rgba(212,99,62,.7);font-size:13.5px;color:rgba(var(--cream),.8);animation:pickIn .38s var(--ease) both;text-wrap:pretty}
.twin b{color:rgb(var(--cream))}
.twin button{display:block;margin-top:8px;height:36px;padding:0 14px;border:0;border-radius:18px;background:rgba(var(--cream),.1);font-size:13px;font-weight:600;color:rgb(var(--cream))}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

<body>
<div class="app" id="app">
  <div class="compact" id="compact"><b>Parties</b><span><i id="cAmt" style="font-style:normal"></i><small>you owe</small></span></div>

    <button type="button" class="tab" data-x><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-2.75-1.6L12 20.5l-2.75-1.6L6.5 20.5v-17Z"/><path d="M9.5 8h5M9.5 11.5h5"/></svg><span>Bills</span></button>
    <button type="button" class="tab" data-x><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8.5h12l-.9 10.2a1.5 1.5 0 0 1-1.5 1.3H8.4a1.5 1.5 0 0 1-1.5-1.3L6 8.5Z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg><span>POs</span><i class="count">100</i></button>
    <button type="button" class="tab" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="7.5" r="1.6"/><circle cx="16.5" cy="7.5" r="1.6"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/></svg><span>Parties</span><i class="count">4</i></button>
    <i class="here" aria-hidden="true"></i>
  </nav>
  <div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastBtn" hidden>Undo</button></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const inr = (n) => '₹' + Math.round(+n || 0).toLocaleString('en-IN');
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = (n) => n.replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const CHEV = '<svg class="c" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const X = '<button type="button" class="x" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';

/* stand-in directory. owe = you owe them · ahead = paid more than their bills add up to · paid = paid to date */
let uid = 0;
const P = (name, type, trade, phone, o) => Object.assign({ id: ++uid, name, type, trade, phone, owe: 0, ahead: 0, paid: 0, pending: false, bank: '', aka: '', gst: type === 'vendor' ? 'Unregistered' : '' }, o || {});
let PARTIES = [
  P('Pattabhi Traders', 'vendor', 'Steel', '98481 20455', { owe: 68000, paid: 412000, gst: 'Regular' }),
  P('Lakshmi Transport', 'vendor', 'Transport', '99890 11276', { owe: 38700, paid: 126000 }),
  P('Sri Veera Durga Waterproofing', 'vendor', 'Waterproofing', '90001 55511', { owe: 18600, paid: 20000, gst: 'Regular' }),
  P('Sreekara Electricals', 'vendor', 'Electrical', '98480 12321', { owe: 5700, paid: 41200 }),
  P('Apex', 'vendor', '', '98481 42200', { pending: true }),
  P('APEPDCL', 'vendor', 'Electricity board', '', { pending: true, paid: 18400 }),
  P('Devi lorry services', 'vendor', 'Transport', '94401 77120', { ahead: 995400, paid: 995400 }),
  P('Dhaveedu Sadanala', 'worker', 'Labour', '93912 04417', { paid: 38200 }),
  P('Hardware-Misc', 'vendor', 'Hardware, small buys', '', { pending: true, paid: 12840, ahead: 12840 }),
  P('Jagadish electricals', 'vendor', 'Electrical', '98662 30918', { paid: 9600 }),
  P('Jagadish Maila', 'vendor', 'Fabrication', '99123 45110', { ahead: 8500, paid: 8500 }),
  P('Jitendra POP', 'vendor', 'False ceiling', '', { ahead: 26569, paid: 26569 }),
  P('KKD Hardware', 'vendor', 'Hardware', '98499 80021', { paid: 86300, gst: 'Regular' }),
  P('Nandu Gollapudi', 'vendor', '', '93553 56789', { pending: true }),
  P('Pakkurthi Srinivas', 'worker', 'Mason', '96522 71804', { paid: 214500 }),
  P('Raju Aradadi', 'worker', 'Painter', '97011 22046', { ahead: 73431, paid: 73431 }),
  P('Raju Kojjavarapu', 'worker', 'Supervisor', '99088 59456', { paid: 152000, aka: 'Raju supervisor' }),
  P('Ramu Chinta', 'worker', 'Carpenter', '95502 66190', { paid: 64000 }),
  P('Ravi Electricals', 'vendor', 'Electrical', '98855 40012', { paid: 6400 }),
  P('Sai Sand Suppliers', 'vendor', 'Sand', '99487 30077', { paid: 51000 }),
  P('Sonu Vishwakarma', 'worker', 'Tile fitter', '90143 87752', { paid: 44100 }),
  P('SR Dealers', 'vendor', 'Hardware', '98850 71234', { paid: 3420 }),
  P('Sreekari', 'vendor', '', '', { pending: true }),
  P('Sri Durga Cements', 'vendor', 'Cement', '98480 55190', { paid: 138000, gst: 'Regular' }),
  P('Sri Phanibhushana Steels', 'vendor', 'Steel', '98491 00873', { ahead: 266800, paid: 266800, gst: 'Regular' }),
  P('Srinivas Boddupalli', 'worker', 'Electrician', '99636 41258', { paid: 27000 }),
  P('Venkat', 'worker', 'Shuttering', '98666 09471', { paid: 191500 })
];
const TOTALS = { all: 184, vendor: 147, worker: 37, client: 0 };                  /* your real counts; the list below is a sample of them */
let type = 'all', query = '', sort = 'az', only = '', litId = 0;

/* ---------- paint ---------- */
function visible() {
  const q = query.trim().toLowerCase().replace(/\s+/g, '');
  return PARTIES.filter((p) => (type === 'all' || p.type === type) && (!only || (only === 'owe' ? p.owe > 0 : only === 'ahead' ? p.ahead > 0 : p.pending)) &&
    (!q || (p.name + p.trade + p.phone + p.aka).toLowerCase().replace(/\s+/g, '').includes(q)));
}
function rowHTML(p) {
  const meta = (p.pending ? '<i class="ring"></i>pending · ' : '') + (p.type === 'worker' ? 'Worker' : p.type === 'client' ? 'Client' : 'Vendor') + (p.trade ? ' · ' + esc(p.trade) : '') + (p.phone && !p.trade ? ' · ' + esc(p.phone) : '');
  const fig = p.owe ? '<span class="fig"><b>' + inr(p.owe) + '</b><small>you owe</small></span>' : p.ahead ? '<span class="fig ahead"><b>' + inr(p.ahead) + '</b><small>paid ahead</small></span>' : p.paid ? '<span class="fig paid"><b>' + inr(p.paid) + '</b><small>paid so far</small></span>' : '';
  return '<div class="row' + (p.id === litId ? ' lit' : '') + '" data-id="' + p.id + '"><button type="button" class="go" data-go><span class="av' + (p.type === 'worker' ? ' w' : '') + '">' + esc(initials(p.name)) + '</span><span class="nm"><b>' + esc(p.name) + '</b><span>' + meta + '</span></span>' + fig + '</button>' +
    '<button type="button" class="dots" data-card aria-label="' + esc(p.name) + ': call, WhatsApp, details"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>';
}
function paint() {
  const owed = PARTIES.filter((p) => p.owe > 0), total = owed.reduce((a, p) => a + p.owe, 0);
  $('#owedAmt').textContent = inr(total); $('#cAmt').textContent = inr(total);
  $('#sub').textContent = 'to ' + owed.length + ' of ' + TOTALS.all + ' parties · ' + TOTALS.vendor + ' vendors · ' + TOTALS.worker + ' workers';
  $('#nPending').textContent = PARTIES.filter((p) => p.pending).length;
  $('#pAhead').setAttribute('aria-pressed', only === 'ahead'); $('#pPending').setAttribute('aria-pressed', only === 'pending');
  $('#chips').innerHTML = [['all', 'All'], ['vendor', 'Vendors'], ['worker', 'Workers'], ['client', 'Clients']].map((c) => '<button type="button" class="chip" data-t="' + c[0] + '" aria-pressed="' + (c[0] === type) + '">' + c[1] + '<em>' + TOTALS[c[0]] + '</em></button>').join('');
  const rows = visible(), filtered = query.trim() || only, res = $('#result'); res.hidden = !filtered;
  if (only) res.innerHTML = { owe: '<b>' + rows.length + '</b> you owe money to.', ahead: '<b>' + rows.length + '</b> paid more than their bills add up to. Usually the bills are missing, or not linked to the payments.', pending: '<b>' + rows.length + '</b> added but not checked yet: no phone, no trade, or never confirmed.' }[only] + '<button type="button" data-clear>Show all</button>';
  else if (query.trim()) res.innerHTML = '<b>' + rows.length + '</b> ' + (rows.length === 1 ? 'match' : 'matches');
  let html = '';
  const plain = sort === 'az' && !filtered;
  if (!rows.length) html = type === 'client' && !filtered ? '<div class="empty"><b>No clients yet</b>Add the people who pay you, and what they owe shows up here.<br><button type="button" data-new="client">Add a client</button></div>'
    : '<div class="empty"><b>Nobody by that name</b>' + (query.trim() ? 'Add “' + esc(query.trim()) + '” as a new party?<br><button type="button" data-new="">Add them</button>' : 'Nothing to show here.') + '</div>';
  else if (plain) {
    const az = rows.slice().sort((a, b) => a.name.localeCompare(b.name)), letters = [...new Set(az.map((p) => p.name[0].toUpperCase()))];
    html = letters.map((L) => '<div class="sec" id="L-' + L + '"><h2>' + L + '</h2><span></span></div><div class="card">' + az.filter((p) => p.name[0].toUpperCase() === L).map(rowHTML).join('') + '</div>').join('');
    $('#rail').innerHTML = letters.map((L) => '<button type="button" tabindex="-1" data-l="' + L + '">' + L + '</button>').join('');
  } else {
    const s = rows.slice().sort((a, b) => sort === 'owe' ? (b.owe - a.owe) || (b.ahead - a.ahead) : sort === 'paid' ? b.paid - a.paid : a.name.localeCompare(b.name));
    html = '<div style="height:12px"></div><div class="card wide">' + s.map(rowHTML).join('') + '</div>';
  }
  $('#list').innerHTML = html; $('#rail').classList.toggle('hide', !plain || !rows.length);
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('wide', !plain));
  litId = 0;
}
$('#chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; type = b.dataset.t; buzz(4); paint(); });
$('#q').addEventListener('input', (e) => { query = e.target.value; paint(); });
$('#result').addEventListener('click', (e) => { if (e.target.closest('[data-clear]')) { only = ''; paint(); } });
let holdTools = 0;
const only_ = (k) => { only = only === k ? '' : k; buzz(5); paint(); holdTools = Date.now() + 1200; $('#tools').classList.remove('tuck'); if (only) $('#tools').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
$('#owedBtn').addEventListener('click', () => only_('owe')); $('#pAhead').addEventListener('click', () => only_('ahead')); $('#pPending').addEventListener('click', () => only_('pending'));
$('#list').addEventListener('click', (e) => {
  const n = e.target.closest('[data-new]'); if (n) { openNew(query.trim(), n.dataset.new); return; }
  const r = e.target.closest('.row'); if (!r) return; const p = PARTIES.find((x) => x.id === +r.dataset.id);
  if (e.target.closest('[data-card]')) { openCard(p); return; }
  if (e.target.closest('[data-go]')) say('Opens ' + p.name + '\'s ledger');
});

/* ---------- the letter rail: slide a thumb down the edge ---------- */
(() => {
  const rail = $('#rail'), letter = $('#letter'); let on = false, last = '';
  const hit = (y) => { const el = document.elementFromPoint(rail.getBoundingClientRect().left + 10, y), L = el && el.dataset && el.dataset.l; if (!L || L === last) return; last = L;
    rail.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.l === L)); letter.textContent = L; letter.classList.add('on'); buzz(3);
    const t = document.getElementById('L-' + L); if (t) $('#view').scrollTo({ top: t.offsetTop - 150 }); };
  const end = () => { on = false; last = ''; letter.classList.remove('on'); rail.querySelectorAll('button').forEach((b) => b.classList.remove('on')); };
  rail.addEventListener('pointerdown', (e) => { on = true; try { rail.setPointerCapture(e.pointerId); } catch (x) {} hit(e.clientY); });
  rail.addEventListener('pointermove', (e) => { if (on) hit(e.clientY); });
  ['pointerup', 'pointercancel'].forEach((n) => rail.addEventListener(n, end));
})();

/* ---------- panels ---------- */
const panel = $('#panel'), scrim = $('#scrim');
function openPanel(html) { $('#pBody').innerHTML = html; panel.scrollTop = 0; panel.classList.add('on'); scrim.classList.add('on'); $('#fab').classList.add('away'); $('#rail').classList.add('hide'); buzz(8); }
function closePanel() { panel.classList.remove('on'); scrim.classList.remove('on'); $('#fab').classList.remove('away'); document.activeElement && document.activeElement.blur(); C = null; N = null; paint(); }
scrim.addEventListener('click', closePanel);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panel.classList.contains('on')) closePanel(); });
if (window.visualViewport) { const vv = window.visualViewport, app = $('#app'); const lift = () => { const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); app.classList.toggle('kb', kb > 80); app.style.setProperty('--kb', (kb > 80 ? kb - 12 : 0) + 'px'); }; vv.addEventListener('resize', lift); vv.addEventListener('scroll', lift); }

/* the party itself: reach them, or change anything about them, in place */
let C = null;
const TYPES = [['vendor', 'Vendor'], ['worker', 'Worker'], ['client', 'Client']];
function openCard(p) { C = { p, open: '', dirty: false, was: JSON.stringify(p) }; openPanel(''); paintCard(); }
function paintCard(changed) {
  const p = C.p, tel = p.phone.replace(/\D/g, '');
  const row = (k, l, v, pick, o) => '<button type="button" class="rowS' + (C.open === k ? ' open' : '') + '" data-row="' + k + '"><span class="l">' + l + '</span><span class="v' + (v ? '' : ' none') + ((o || {}).mono && v ? ' mono' : '') + (changed === k ? ' chg' : '') + '">' + esc(v || 'Add') + '</span>' + CHEV + '</button>' + (C.open === k ? '<div class="pick">' + pick + '</div>' : '');
  const inp = (k, ph, mode) => '<input class="inp" id="edit" data-f="' + k + '" type="' + (mode === 'tel' ? 'tel' : 'text') + '"' + (mode ? ' inputmode="' + mode + '"' : '') + ' autocomplete="off" enterkeyhint="done" placeholder="' + ph + '" value="' + esc(p[k]) + '">';
  $('#pBody').innerHTML = '<div class="p-head"><span class="av">' + esc(initials(p.name)) + '</span><div class="t"><h2>' + esc(p.name) + '</h2><span>' + (p.pending ? 'Pending · ' : '') + TYPES.find((t) => t[0] === p.type)[1] + (p.trade ? ' · ' + esc(p.trade) : '') + '</span></div>' + X + '</div>' +
    '<div class="two"><div><small>Paid so far</small><b>' + inr(p.paid) + '</b></div><div><small>' + (p.ahead ? 'Paid ahead of bills' : 'You owe') + '</small><b class="' + (p.owe ? 'owe' : '') + '">' + (p.owe ? inr(p.owe) : p.ahead ? inr(p.ahead) : 'Nothing') + '</b></div></div>' +
    '<div class="acts"><button type="button" class="pri" data-ledger><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h10a2 2 0 0 1 2 2v15H8a2 2 0 0 1-2-2v-15Z"/><path d="M9.5 8h5M9.5 11.5h5"/></svg>Ledger</button>' +
      (tel ? '<a class="wa" href="https://wa.me/91' + tel + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/></svg>Chat</a><a href="tel:+91' + tel + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h3l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4 1.5v3A1.5 1.5 0 0 1 18.5 19 14.5 14.5 0 0 1 5 5.5 1.5 1.5 0 0 1 6.5 4Z"/></svg>Call</a>'
           : '<button type="button" data-row="phone" style="grid-column:span 2;opacity:.7">Add a phone to call or chat</button>') + '</div>' +
    row('name', 'Name', p.name, inp('name', 'Name')) +
    row('type', 'They are a', TYPES.find((t) => t[0] === p.type)[1], '<div class="seg">' + TYPES.map((t) => '<button type="button" data-type="' + t[0] + '" aria-pressed="' + (t[0] === p.type) + '">' + t[1] + '</button>').join('') + '</div>') +
    row('trade', 'Trade or role', p.trade, inp('trade', 'Mason, steel, transport…')) +
    row('phone', 'Phone', p.phone ? '+91 ' + p.phone : '', '<div class="tel"><span>+91</span><input id="edit" data-f="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="off" enterkeyhint="done" placeholder="98480 12321" value="' + esc(p.phone) + '"></div>' + (canPick ? '<button type="button" class="hint" data-pickc style="border:0;background:none;text-decoration:underline;padding:0;color:rgba(250,248,243,.8)">Pick from your contacts</button>' : ''), { mono: true }) +
    row('bank', 'Bank or UPI', p.bank, inp('bank', 'Account no. or UPI id'), { mono: true }) +
    row('aka', 'Also known as', p.aka, inp('aka', 'Sreenu, Srinu mestri…') + '<p class="hint">Never shown. Used so WhatsApp messages and search still find them under other names.</p>') +
    (p.type === 'vendor' ? row('gst', 'GST', p.gst, '<div class="seg">' + ['Regular', 'Composition', 'Unregistered'].map((g) => '<button type="button" data-gst="' + g + '" aria-pressed="' + (g === p.gst) + '" style="font-size:13px">' + g + '</button>').join('') + '</div>') : '') +
    '<div class="foot"><button type="button" class="big" id="save"' + (C.dirty ? '' : ' disabled') + '>' + (C.dirty ? 'Save changes' : 'No changes') + '</button></div>' +
    '<button type="button" class="del" id="del"><span>Hold to delete this party</span></button>';
  const ed = $('#edit'); if (ed) { ed.focus({ preventScroll: true }); const r = document.querySelector('.rowS.open'); r && r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  holdToDelete();
}
const canPick = 'contacts' in navigator && 'select' in navigator.contacts;
const tenDigits = (v) => v.replace(/\D/g, '').replace(/^(91|0)(?=\d{10})/, '').slice(0, 10), pretty = (d) => d.length > 5 ? d.slice(0, 5) + ' ' + d.slice(5) : d;
function holdToDelete() {
  const d = $('#del'); if (!d) return; let t = 0;
  const stop = () => { if (!d.classList.contains('hold')) return; clearTimeout(t); d.classList.remove('hold'); say('Keep holding to delete'); };
  d.addEventListener('contextmenu', (e) => e.preventDefault());
  d.addEventListener('pointerdown', (e) => { e.preventDefault(); if (C.p.paid || C.p.owe) { say('They have entries in Book. A party with a ledger cannot be deleted.'); return; } d.classList.add('hold'); buzz(6);
    t = setTimeout(() => { buzz([14, 40, 24]); const p = C.p, i = PARTIES.indexOf(p); PARTIES.splice(i, 1); closePanel(); say(p.name + ' deleted', () => { PARTIES.splice(i, 0, p); litId = p.id; paint(); }); }, 1000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((n) => d.addEventListener(n, stop));
}

/* a new party: from contacts first, and never twice */
let N = null;
function openNew(name, kind) { N = { name: name || '', type: kind || (type !== 'all' ? type : 'vendor'), phone: '' }; openPanel(''); paintNew(); setTimeout(() => { const n = $('#nName'); n && !N.name && n.focus({ preventScroll: true }); }, 300); }
function twinOf(name) { const k = name.toLowerCase().replace(/[^a-z]/g, ''); if (k.length < 4) return null; return PARTIES.find((p) => { const n = p.name.toLowerCase().replace(/[^a-z]/g, ''), a = p.aka.toLowerCase().replace(/[^a-z]/g, ''); return n.startsWith(k.slice(0, 6)) || k.startsWith(n.slice(0, 6)) || (a && a.includes(k.slice(0, 5))); }); }
function paintNew() {
  $('#pBody').innerHTML = '<div class="p-head"><div class="t"><h2>New party</h2><span>The rest can wait. A name is enough to start paying them.</span></div>' + X + '</div>' +
    '<button type="button" class="from" data-pickn><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><circle cx="12" cy="10" r="2.4"/><path d="M8.2 16.2c.7-1.7 2.1-2.6 3.8-2.6s3.1.9 3.8 2.6"/></svg></i><span><b>From your contacts</b>Name and number in one tap</span>' + CHEV.replace('class="c"', 'width="16" height="16" fill="none" stroke="rgba(250,248,243,.35)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"') + '</button>' +
    '<label class="lab" for="nName">Name</label><input class="inp" id="nName" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Person or firm" value="' + esc(N.name) + '"><div id="twin"></div>' +
    '<span class="lab">They are a</span><div class="seg" id="nType">' + TYPES.map((t) => '<button type="button" data-ntype="' + t[0] + '" aria-pressed="' + (t[0] === N.type) + '">' + t[1] + '</button>').join('') + '</div>' +
    '<label class="lab" for="nPhone">Phone, if you have it</label><div class="tel"><span>+91</span><input id="nPhone" type="tel" inputmode="numeric" maxlength="11" autocomplete="off" enterkeyhint="done" placeholder="98480 12321" value="' + esc(N.phone) + '"></div>' +
    '<div class="foot"><button type="button" class="big" id="addParty"' + (N.name.trim() ? '' : ' disabled') + '>Add party</button></div>';
  paintTwin();
}
function paintTwin() { const t = twinOf(N.name), box = $('#twin'); if (!box) return; box.innerHTML = t ? '<div class="twin"><b>' + esc(t.name) + '</b> is already here' + (t.trade ? ' (' + esc(t.trade.toLowerCase()) + ')' : '') + '. Same one?<button type="button" data-opentwin="' + t.id + '">Yes, open them</button></div>' : ''; }

panel.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) { closePanel(); return; }
  if (b.dataset.say) { say(b.dataset.say); return; }
  if (C) {
    const p = C.p;
    if (b.hasAttribute('data-ledger')) { closePanel(); say('Opens ' + p.name + '\'s ledger'); return; }
    if (b.dataset.row) { C.open = C.open === b.dataset.row ? '' : b.dataset.row; buzz(3); paintCard(); return; }
    if (b.dataset.type) { p.type = b.dataset.type; C.open = ''; C.dirty = true; buzz(4); paintCard('type'); return; }
    if (b.dataset.gst) { p.gst = b.dataset.gst; C.open = ''; C.dirty = true; buzz(4); paintCard('gst'); return; }
    if (b.hasAttribute('data-pickc')) { try { const r = await navigator.contacts.select(['tel'], { multiple: false }); const t = r && r[0] && r[0].tel && r[0].tel[0]; if (t) { p.phone = pretty(tenDigits(t)); C.dirty = true; C.open = ''; paintCard('phone'); } } catch (x) {} return; }
    if (b.id === 'save') { if (p.phone || p.trade) p.pending = false; b.classList.add('ok'); b.textContent = 'Saved'; buzz(8); const was = C.was; litId = p.id; setTimeout(() => { closePanel(); say('Saved', () => { Object.assign(p, JSON.parse(was)); litId = p.id; paint(); }); }, 480); }
    return;
  }
  if (N) {
    if (b.dataset.ntype) { N.type = b.dataset.ntype; [...$('#nType').children].forEach((c) => c.setAttribute('aria-pressed', c === b)); buzz(4); return; }
    if (b.dataset.opentwin) { const t = PARTIES.find((x) => x.id === +b.dataset.opentwin); N = null; openCard(t); return; }
    if (b.hasAttribute('data-pickn')) {
      if (!canPick) { say('This browser can\'t open your contacts. Type the name below.'); $('#nName').focus(); return; }
      try { const r = await navigator.contacts.select(['name', 'tel'], { multiple: false }), c = r && r[0]; if (c) { N.name = ((c.name && c.name[0]) || '').trim(); N.phone = pretty(tenDigits((c.tel && c.tel[0]) || '')); buzz(8); paintNew(); } } catch (x) {} return;
    }
    if (b.id === 'addParty') { const p = P(N.name.trim(), N.type, '', N.phone, { pending: !N.phone }); PARTIES.push(p); litId = p.id; b.classList.add('ok'); b.textContent = 'Added'; buzz(8);
      setTimeout(() => { closePanel(); type = 'all'; only = ''; query = ''; $('#q').value = ''; litId = p.id; paint(); const r = document.querySelector('.row[data-id="' + p.id + '"]'); r && r.scrollIntoView({ block: 'center', behavior: 'smooth' }); say(p.name + ' added' + (p.pending ? '. Pending until they have a phone or trade.' : ''), () => { PARTIES.splice(PARTIES.indexOf(p), 1); paint(); }); }, 480); }
  }
});
panel.addEventListener('input', (e) => {
  if (C && e.target.id === 'edit') { const k = e.target.dataset.f; if (k === 'phone') e.target.value = pretty(tenDigits(e.target.value)); C.p[k] = e.target.value.trim(); C.dirty = true; const v = e.target.closest('.pick').previousElementSibling.querySelector('.v'); v.textContent = (k === 'phone' && C.p[k] ? '+91 ' : '') + (C.p[k] || 'Add'); v.classList.toggle('none', !C.p[k]); const s = $('#save'); s.disabled = false; s.textContent = 'Save changes'; if (k === 'name') panel.querySelector('.p-head h2').textContent = C.p.name || 'Unnamed'; }
  if (N && e.target.id === 'nName') { N.name = e.target.value; $('#addParty').disabled = !N.name.trim(); paintTwin(); }
  if (N && e.target.id === 'nPhone') { e.target.value = pretty(tenDigits(e.target.value)); N.phone = e.target.value; }
});
panel.addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; if (C && e.target.id === 'edit') { C.open = ''; paintCard(e.target.dataset.f); } if (N && e.target.id === 'nName') $('#nPhone').focus(); if (N && e.target.id === 'nPhone') e.target.blur(); });
$('#more').addEventListener('click', () => openPanel('<div class="p-head"><div class="t"><h2>Parties</h2></div>' + X + '</div><div class="menu">' +
  '<button type="button" data-say="Add many at once from a sheet, or straight from your contacts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0-8 0M4 20a8 8 0 0 1 12-7M18 14v6M15 17h6"/></svg>Bulk add</button>' +
  '<button type="button" data-say="Exports what is shown as CSV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>Export what is shown</button>' +
  '<button type="button" data-say="Finds parties that look like the same person and merges their ledgers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 6 6h6M18 4v4M14 12l4 4-4 4"/></svg>Find duplicates</button></div>'));

/* ---------- scroll: slim header, quick-return tools, folding capsule ---------- */
const view = $('#view'); let lastY = 0;
view.addEventListener('scroll', () => {
  const y = view.scrollTop, past = y > $('#hero').offsetHeight - 54, d = y - lastY;
  $('#compact').classList.toggle('on', past);
  if (Math.abs(d) > 6) { $('#fab').classList.toggle('folded', d > 0 && y > 60); $('#tools').classList.toggle('tuck', d > 0 && past && document.activeElement !== $('#q') && Date.now() > holdTools); lastY = y; }
  if (!past) $('#tools').classList.remove('tuck'); if (y < 8) $('#fab').classList.remove('folded');
}, { passive: true });
$('#q').addEventListener('focus', () => $('#tools').classList.remove('tuck'));
$('#fab').addEventListener('click', () => openNew(''));
document.querySelectorAll('[data-x]').forEach((b) => b.addEventListener('click', () => say('Only Parties is built in this prototype')));
let toastT = 0, undoFn = null;
function say(text, undo) { $('#toastText').textContent = text; undoFn = undo || null; $('#toastBtn').hidden = !undo; $('#toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), undo ? 4500 : 2100); }
$('#toastBtn').addEventListener('click', () => { $('#toast').classList.remove('on'); if (undoFn) { buzz(5); undoFn(); undoFn = null; } });

paint();
</script>
</body>
</html>
